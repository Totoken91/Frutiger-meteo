<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frutiger Météo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23bfe9ff'/%3E%3Cstop offset='.6' stop-color='%232f8fe8'/%3E%3Cstop offset='1' stop-color='%230a3f96'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3Cellipse cx='38' cy='30' rx='24' ry='13' fill='white' opacity='.45'/%3E%3C/svg%3E">

<!-- ═══════════════════════ CONFIGURATION ═══════════════════════ -->
<script>
window.METEO_CONFIG = {
  ville:        "Paris",
  latitude:     48.8566,
  longitude:    2.3522,
  // Durée d'affichage de chaque vue (secondes)
  dureeVue:     10,
  // Rafraîchissement des données (minutes)
  rafraichissement: 10,
};
</script>
<!-- ═════════════════════════════════════════════════════════════ -->

<style>
  * { margin:0; padding:0; box-sizing:border-box; cursor:none !important; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#1a6fd8;
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:#fff; user-select:none; -webkit-user-select:none;
    font-kerning:normal;
  }
  #gl { position:fixed; inset:0; display:block; }

  /* ── Scène 1920×1080 mise à l'échelle ─────────────────────── */
  #stage {
    position:fixed; left:50%; top:50%; width:1920px; height:1080px;
    transform:translate(calc(-50% + var(--ox,0px)), calc(-50% + var(--oy,0px))) scale(var(--s,1));
    text-shadow:0 1px 2px rgba(6,26,70,.5), 0 2px 14px rgba(2,24,66,.4);
  }

  /* ── Verre ────────────────────────────────────────────────── */
  .glass {
    position:relative; border-radius:30px; overflow:hidden;
    background:
      radial-gradient(135% 110% at 16% -18%, rgba(255,255,255,.40), rgba(255,255,255,.10) 46%, rgba(255,255,255,0) 60%),
      linear-gradient(163deg, rgba(255,255,255,.20), rgba(255,255,255,.06) 46%, rgba(135,190,255,.12) 76%, rgba(255,255,255,.17));
    -webkit-backdrop-filter:blur(30px) saturate(1.7) brightness(.9);
    backdrop-filter:blur(30px) saturate(1.7) brightness(.9);
    border:1px solid rgba(255,255,255,.52);
    box-shadow:0 30px 80px rgba(3,16,52,.5),
               0 2px 12px  rgba(6,26,70,.3),
               0 0 0 1px rgba(120,180,255,.12),
               inset 0 2px 1.5px rgba(255,255,255,.9),
               inset 0 -1.5px 1px rgba(255,255,255,.28),
               inset 0 -16px 34px rgba(120,195,255,.20),
               inset 0 30px 50px -22px rgba(255,255,255,.5);
  }
  .glass::before { /* vitre supérieure : reflet net à bord courbe (signature Aero) */
    content:""; position:absolute; left:10px; right:10px; top:5px; height:47%;
    background:linear-gradient(rgba(255,255,255,.50), rgba(255,255,255,.20) 68%, rgba(255,255,255,.09));
    border-radius:24px 24px 320px 320px / 24px 24px 70px 70px;
    pointer-events:none;
  }
  .glass::after { /* balayage lumineux à l'entrée */
    content:""; position:absolute; top:-20%; bottom:-20%; width:34%; left:0;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,.5) 48%, rgba(255,255,255,.14) 60%, transparent);
    transform:translateX(-320%) skewX(-14deg); pointer-events:none;
  }
  .view.active .glass::after { animation:sheen 1.7s .45s cubic-bezier(.3,.4,.2,1) both; }
  @keyframes sheen { from{transform:translateX(-320%) skewX(-14deg)} to{transform:translateX(560%) skewX(-14deg)} }

  .float  { animation:floaty 9s  ease-in-out infinite alternate; }
  .float2 { animation:floaty 12s ease-in-out infinite alternate-reverse; }
  @keyframes floaty { from{transform:translateY(-5px)} to{transform:translateY(7px)} }

  /* ── Barre supérieure ─────────────────────────────────────── */
  #topbar {
    position:absolute; left:70px; right:70px; top:44px; height:110px;
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  #brand { display:flex; align-items:center; gap:20px; }
  #orb {
    width:58px; height:58px; border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #d9f2ff 0%, #59b7f5 38%, #1668d8 72%, #0a3c96 100%);
    box-shadow:0 8px 24px rgba(20,90,200,.55), inset 0 2px 6px rgba(255,255,255,.75), inset 0 -4px 10px rgba(4,30,90,.5);
    position:relative;
  }
  #orb::before {
    content:""; position:absolute; left:16%; top:9%; width:64%; height:42%; border-radius:50%;
    background:linear-gradient(rgba(255,255,255,.92), rgba(255,255,255,.05));
  }
  #brandname { font-size:30px; font-weight:300; letter-spacing:.04em; }
  #brandname b { font-weight:600; }
  #cityline { font-size:19px; opacity:.82; font-weight:400; margin-top:2px; letter-spacing:.06em; }
  #clockbox { text-align:right; }
  #clock { font-size:88px; font-weight:200; line-height:.95; letter-spacing:.01em; font-variant-numeric:tabular-nums; }
  #clock .colon { animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  #date { font-size:22px; font-weight:300; opacity:.85; margin-top:6px; letter-spacing:.05em; }

  /* ── Zone des vues ────────────────────────────────────────── */
  #views { position:absolute; left:70px; right:70px; top:210px; bottom:120px; }
  /* NB : pas de `filter` ici — un filter sur un ancêtre désactive le
     backdrop-filter des .glass enfants, ce qui provoque un saut de couleur
     à la fin de la transition. On n'anime que opacité + transform. */
  .view {
    position:absolute; inset:0; opacity:0; visibility:hidden;
    transform:scale(1.06) translateY(34px);
    transition:opacity .75s ease, transform .9s cubic-bezier(.16,1,.3,1), visibility 0s linear .95s;
  }
  .view.active {
    opacity:1; visibility:visible; transform:none;
    transition:opacity .95s ease .3s, transform 1.05s cubic-bezier(.16,1,.3,1) .3s, visibility 0s;
  }
  .view.leaving {
    opacity:0; visibility:visible; transform:scale(.95) translateY(-26px);
  }
  .view.active .st { animation:rise 1s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(.38s + var(--i,0)*.09s); }
  @keyframes rise { from{opacity:0; transform:translateY(34px)} to{opacity:1; transform:none} }

  .eyebrow {
    display:flex; align-items:center; gap:16px;
    font-size:19px; font-weight:600; letter-spacing:.42em; text-transform:uppercase;
    opacity:.85; margin-bottom:26px; padding-left:6px;
  }
  .eyebrow::after {
    content:""; height:2px; width:110px; border-radius:2px;
    background:linear-gradient(90deg, rgba(255,255,255,.75), rgba(255,255,255,0));
  }

  /* ── Vue Maintenant ───────────────────────────────────────── */
  #hero {
    height:600px; margin-top:24px; display:flex; align-items:center; justify-content:space-evenly;
    padding:0 60px;
  }
  #hero-icon { width:340px; filter:drop-shadow(0 18px 30px rgba(6,30,90,.35)); animation:floaty 7s ease-in-out infinite alternate; }
  #hero-main { text-align:left; }
  #hero-temp { font-size:290px; font-weight:200; line-height:.86; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  #hero-temp sup { font-size:.38em; font-weight:200; vertical-align:.62em; margin-left:6px; opacity:.9; }
  #hero-cond { font-size:46px; font-weight:300; margin-top:18px; letter-spacing:.02em; }
  #hero-sub  { font-size:26px; font-weight:300; opacity:.85; margin-top:10px; }
  #hero-chips { display:flex; gap:18px; margin-top:34px; }
  .chip {
    display:flex; align-items:center; gap:12px; padding:12px 26px; border-radius:999px;
    background:linear-gradient(rgba(255,255,255,.46), rgba(255,255,255,.12) 55%, rgba(150,200,255,.22));
    border:1px solid rgba(255,255,255,.55);
    box-shadow:inset 0 1.5px 1px rgba(255,255,255,.85), inset 0 -6px 12px rgba(120,190,255,.25), 0 8px 20px rgba(4,20,60,.28);
    font-size:24px; font-weight:400;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  .chip b { font-weight:600; }
  .chip svg { width:26px; height:26px; }

  /* ── Vue Détails ──────────────────────────────────────────── */
  #tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:26px; margin-top:6px; }
  .tile { height:296px; padding:34px 40px; display:flex; flex-direction:column; }
  .tile .t-head { display:flex; align-items:center; gap:16px; font-size:21px; letter-spacing:.24em; text-transform:uppercase; font-weight:600; opacity:.82; }
  .tile .t-head svg { width:44px; height:44px; filter:drop-shadow(0 4px 8px rgba(6,30,90,.3)); }
  .tile .t-value { font-size:84px; font-weight:200; margin-top:auto; line-height:1; font-variant-numeric:tabular-nums; }
  .tile .t-value small { font-size:.42em; font-weight:300; opacity:.85; margin-left:6px; }
  .tile .t-sub { font-size:22px; font-weight:300; opacity:.8; margin-top:12px; height:26px; }
  .gauge { margin-top:16px; height:10px; border-radius:5px; background:rgba(8,30,80,.35); overflow:hidden;
           box-shadow:inset 0 1px 3px rgba(4,16,50,.5); }
  .gauge i { display:block; height:100%; border-radius:5px;
             background:linear-gradient(90deg,#9fe0ff,#4facfe 55%,#e8f7ff);
             box-shadow:0 0 12px rgba(120,200,255,.8); }

  /* ── Vue Horaire ──────────────────────────────────────────── */
  #hourly-panel { height:600px; margin-top:6px; padding:42px 30px 24px; }
  #hourly-svg { width:100%; height:100%; }
  #hourly-svg text { font-family:inherit; }

  /* ── Vue Semaine ──────────────────────────────────────────── */
  #week-panel { margin-top:6px; padding:34px 56px; }
  .wrow {
    display:grid; grid-template-columns:200px 76px 96px 86px 1fr 86px; align-items:center;
    height:76px; gap:14px; border-bottom:1px solid rgba(255,255,255,.13);
  }
  .wrow:last-child { border-bottom:none; }
  .wrow.today { background:linear-gradient(90deg, rgba(255,255,255,.13), rgba(255,255,255,0)); border-radius:16px; padding:0 14px; margin:0 -14px; }
  .w-day { font-size:27px; font-weight:400; text-transform:capitalize; }
  .wrow.today .w-day { font-weight:600; }
  .w-icon svg { width:58px; height:58px; filter:drop-shadow(0 4px 8px rgba(6,30,90,.3)); }
  .w-rain { font-size:21px; opacity:.85; display:flex; align-items:center; gap:7px; font-variant-numeric:tabular-nums; }
  .w-rain svg { width:17px; height:17px; }
  .w-min { font-size:26px; font-weight:300; opacity:.72; text-align:right; font-variant-numeric:tabular-nums; }
  .w-max { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .w-track { position:relative; height:12px; border-radius:6px; background:rgba(8,30,80,.35);
             box-shadow:inset 0 1px 3px rgba(4,16,50,.5); }
  .w-seg { position:absolute; top:0; bottom:0; border-radius:6px;
           box-shadow:0 0 14px rgba(160,215,255,.55), inset 0 1px 0 rgba(255,255,255,.5); }

  /* ── Vue Soleil ───────────────────────────────────────────── */
  #sun-panel { height:600px; margin-top:6px; padding:40px 70px 30px; display:flex; flex-direction:column; }
  #sun-svg { width:100%; flex:1; }
  #sun-svg text { font-family:inherit; }
  #sun-chips { display:flex; justify-content:center; gap:22px; padding:10px 0 14px; }

  /* ── Barre inférieure ─────────────────────────────────────── */
  #bottombar {
    position:absolute; left:70px; right:70px; bottom:40px; height:46px;
    display:flex; align-items:center; justify-content:space-between;
  }
  #credit { font-size:17px; font-weight:300; opacity:.5; letter-spacing:.05em; width:340px; }
  #dots { display:flex; gap:14px; align-items:center; }
  .dot {
    width:12px; height:12px; border-radius:999px;
    background:rgba(255,255,255,.35); box-shadow:inset 0 1px 1px rgba(255,255,255,.5);
    transition:all .6s cubic-bezier(.16,1,.3,1);
  }
  .dot.on {
    width:38px; background:linear-gradient(rgba(255,255,255,.95), rgba(200,230,255,.8));
    box-shadow:0 0 16px rgba(190,225,255,.9), inset 0 1px 1px #fff;
  }
  #demo-badge {
    width:340px; text-align:right; font-size:16px; letter-spacing:.3em; font-weight:600;
    opacity:0; transition:opacity 1s; text-transform:uppercase; color:#ffd98a;
  }
  #demo-badge.on { opacity:.85; }

  /* ═══════════════ PORTRAIT (téléphone debout) ═══════════════ */
  body.portrait #stage { width:1080px; height:1920px; }

  /* barre supérieure empilée */
  body.portrait #topbar { flex-direction:column; align-items:flex-start; height:auto; gap:16px; top:70px; }
  body.portrait #orb { width:74px; height:74px; }
  body.portrait #brandname { font-size:42px; }
  body.portrait #cityline { font-size:26px; }
  body.portrait #clockbox { text-align:left; }
  body.portrait #clock { font-size:128px; }
  body.portrait #date { font-size:32px; margin-top:8px; }

  /* zone des vues : centrée verticalement dans la hauteur portrait */
  body.portrait #views { top:430px; bottom:180px; }
  body.portrait .view { display:flex; flex-direction:column; justify-content:center; }
  body.portrait .eyebrow { font-size:27px; margin-bottom:40px; }
  body.portrait .eyebrow::after { width:180px; }

  /* Maintenant : empilé et centré */
  body.portrait #hero { flex-direction:column; height:auto; gap:14px; padding:64px 50px; }
  body.portrait #hero-icon { width:320px; }
  body.portrait #hero-main { text-align:center; }
  body.portrait #hero-temp { font-size:250px; }
  body.portrait #hero-cond { font-size:58px; margin-top:26px; }
  body.portrait #hero-sub  { font-size:34px; }
  body.portrait #hero-chips { justify-content:center; margin-top:48px; }
  body.portrait .chip { font-size:31px; padding:16px 34px; }
  body.portrait .chip svg { width:33px; height:33px; }

  /* Détails : 2 colonnes × 3 rangées */
  body.portrait #tiles { grid-template-columns:repeat(2,1fr); gap:30px; }
  body.portrait .tile { height:352px; padding:42px 46px; }
  body.portrait .tile .t-head { font-size:26px; }
  body.portrait .tile .t-head svg { width:54px; height:54px; }
  body.portrait .tile .t-value { font-size:100px; }
  body.portrait .tile .t-sub { font-size:28px; height:34px; }

  /* Horaire & Soleil : SVG à hauteur naturelle (pas de letterbox) */
  body.portrait #hourly-panel { height:auto; padding:52px 30px 34px; }
  body.portrait #hourly-svg { height:auto; }
  body.portrait #sun-panel { height:auto; padding:52px 60px 40px; }
  body.portrait #sun-svg { flex:none; height:auto; }
  body.portrait #sun-chips { flex-wrap:wrap; gap:16px; }

  /* Semaine : colonnes resserrées, rangées plus hautes */
  body.portrait #week-panel { padding:44px 50px; }
  body.portrait .wrow { grid-template-columns:220px 66px 116px 76px 1fr 76px; gap:12px; height:112px; }
  body.portrait .w-day { font-size:33px; }
  body.portrait .w-icon svg { width:70px; height:70px; }
  body.portrait .w-rain { font-size:25px; }
  body.portrait .w-min, body.portrait .w-max { font-size:32px; }

  /* barre inférieure */
  body.portrait #bottombar { bottom:76px; }
  body.portrait #credit { font-size:23px; width:auto; }
  body.portrait #demo-badge { font-size:22px; width:auto; }
  body.portrait #dots .dot { width:16px; height:16px; }
  body.portrait #dots .dot.on { width:48px; }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="stage">
  <div id="topbar">
    <div id="brand">
      <div id="orb"></div>
      <div>
        <div id="brandname">Frutiger <b>Météo</b></div>
        <div id="cityline">—</div>
      </div>
    </div>
    <div id="clockbox">
      <div id="clock">--<span class="colon">:</span>--</div>
      <div id="date">&nbsp;</div>
    </div>
  </div>

  <div id="views">
    <section class="view" id="v-now"></section>
    <section class="view" id="v-details"></section>
    <section class="view" id="v-hourly"></section>
    <section class="view" id="v-week"></section>
    <section class="view" id="v-sun"></section>
  </div>

  <div id="bottombar">
    <div id="credit">Données Open-Meteo</div>
    <div id="dots"></div>
    <div id="demo-badge">Mode démo</div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   FRUTIGER MÉTÉO — display météo plein écran
   Fond Three.js génératif + UI verre. Aucune ressource externe
   hormis l'API Open-Meteo.
   ════════════════════════════════════════════════════════════════ */

const CFG = window.METEO_CONFIG;
const Q   = new URLSearchParams(location.search);   // ?demo=1  ?vue=2  ?code=61

/* ─────────────────────────── Utilitaires ─────────────────────── */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,t) => a + (b-a)*t;
const fmtH  = new Intl.DateTimeFormat("fr-FR", {hour:"2-digit", minute:"2-digit"});
const fmtDay= new Intl.DateTimeFormat("fr-FR", {weekday:"long"});
const fmtDate=new Intl.DateTimeFormat("fr-FR", {weekday:"long", day:"numeric", month:"long"});
const deg   = v => Math.round(v) + "°";

/* WMO → libellé français + classe visuelle */
const WMO = {
  0:["Ciel dégagé","clear"],        1:["Plutôt dégagé","clear"],
  2:["Partiellement nuageux","part"],3:["Couvert","cloud"],
  45:["Brouillard","fog"],          48:["Brouillard givrant","fog"],
  51:["Bruine légère","drizzle"],   53:["Bruine","drizzle"],   55:["Bruine dense","drizzle"],
  56:["Bruine verglaçante","drizzle"],57:["Bruine verglaçante","drizzle"],
  61:["Pluie faible","rain"],       63:["Pluie","rain"],       65:["Pluie forte","rain"],
  66:["Pluie verglaçante","rain"],  67:["Pluie verglaçante","rain"],
  71:["Neige légère","snow"],       73:["Neige","snow"],       75:["Neige forte","snow"],
  77:["Grésil","snow"],
  80:["Averses éparses","rain"],    81:["Averses","rain"],     82:["Averses violentes","rain"],
  85:["Averses de neige","snow"],   86:["Averses de neige","snow"],
  95:["Orage","storm"],             96:["Orage et grêle","storm"], 99:["Orage violent","storm"],
};
const wmoInfo = c => WMO[c] || ["Temps variable","part"];

const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const windDir = d => COMPASS[Math.round(d/22.5) % 16];

const UV_LABELS = [[3,"Faible"],[6,"Modéré"],[8,"Élevé"],[11,"Très élevé"],[99,"Extrême"]];
const uvLabel = u => (UV_LABELS.find(([m])=>u<m)||UV_LABELS[4])[1];

/* Couleur d'une température (pour les barres min-max) */
function tempColor(t){
  const stops = [[-10,[128,178,255]],[0,[150,206,255]],[10,[185,232,246]],[18,[255,231,168]],[26,[255,178,94]],[34,[255,134,74]]];
  if (t<=stops[0][0]) return stops[0][1];
  for (let i=1;i<stops.length;i++){
    if (t<=stops[i][0]){
      const [t0,c0]=stops[i-1],[t1,c1]=stops[i], k=(t-t0)/(t1-t0);
      return c0.map((v,j)=>Math.round(lerp(v,c1[j],k)));
    }
  }
  return stops[stops.length-1][1];
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

/* Phase de lune (approximation synodique) */
function moonPhase(d){
  const synodic = 29.53058867;
  const days = (d.getTime() - Date.UTC(2000,0,6,18,14)) / 864e5;
  const p = ((days % synodic) + synodic) % synodic / synodic;
  const names = ["Nouvelle lune","Premier croissant","Premier quartier","Gibbeuse croissante",
                 "Pleine lune","Gibbeuse décroissante","Dernier quartier","Dernier croissant"];
  return names[Math.floor(p*8 + .5) % 8];
}

/* ══════════════════════ ICÔNES SVG GÉNÉRÉES ═══════════════════ */
let _uid = 0;
function iconSVG(code, isDay, size){
  const u = "i" + (_uid++);
  const defs = `
    <radialGradient id="${u}s" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fffce9"/><stop offset=".55" stop-color="#ffd94d"/><stop offset="1" stop-color="#ff9c1b"/>
    </radialGradient>
    <radialGradient id="${u}h" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd94d" stop-opacity=".55"/><stop offset="1" stop-color="#ffd94d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="${u}m" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#dce8fb"/><stop offset="1" stop-color="#a9bfe4"/>
    </radialGradient>
    <radialGradient id="${u}mh" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity=".5"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="${u}c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".62" stop-color="#e3eefa"/><stop offset="1" stop-color="#b6cde8"/>
    </linearGradient>
    <linearGradient id="${u}cd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7edf6"/><stop offset=".6" stop-color="#b3c4dc"/><stop offset="1" stop-color="#8299b9"/>
    </linearGradient>
    <linearGradient id="${u}d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5e6ff"/><stop offset=".55" stop-color="#41a0f2"/><stop offset="1" stop-color="#1663c8"/>
    </linearGradient>
    <linearGradient id="${u}b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4b8"/><stop offset=".5" stop-color="#ffc400"/><stop offset="1" stop-color="#ff8e00"/>
    </linearGradient>`;

  const sun = (x,y,r)=>`
    <circle cx="${x}" cy="${y}" r="${r*1.9}" fill="url(#${u}h)"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="url(#${u}s)" stroke="rgba(255,255,255,.55)" stroke-width="1.4"/>
    <ellipse cx="${x-r*.22}" cy="${y-r*.42}" rx="${r*.62}" ry="${r*.34}" fill="#fff" opacity=".5"/>`;

  const moon = (x,y,r)=>`
    <circle cx="${x}" cy="${y}" r="${r*1.8}" fill="url(#${u}mh)"/>
    <mask id="${u}mm"><rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <circle cx="${x+r*.62}" cy="${y-r*.5}" r="${r*.86}" fill="#000"/></mask>
    <circle cx="${x}" cy="${y}" r="${r}" fill="url(#${u}m)" mask="url(#${u}mm)" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
    <ellipse cx="${x-r*.34}" cy="${y-r*.3}" rx="${r*.4}" ry="${r*.22}" fill="#fff" opacity=".55" mask="url(#${u}mm)"/>`;

  const cloud = (x,y,s,dark)=>`
    <g transform="translate(${x},${y}) scale(${s})" filter="drop-shadow(0 3px 3px rgba(20,60,130,.28))">
      <g fill="url(#${u}${dark?"cd":"c"})">
        <circle cx="-20" cy="2"  r="15"/>
        <circle cx="0"   cy="-8" r="19"/>
        <circle cx="19"  cy="2"  r="14"/>
        <rect x="-30" y="0" width="60" height="16" rx="8"/>
      </g>
      <ellipse cx="-4" cy="-11" rx="19" ry="8" fill="#fff" opacity=".55"/>
    </g>`;

  const drop = (x,y,s)=>`
    <g transform="translate(${x},${y}) scale(${s})">
      <path d="M0,-9 C4,-3 6.4,1 6.4,4.4 A6.4,6.4 0 1 1 -6.4,4.4 C-6.4,1 -4,-3 0,-9 Z" fill="url(#${u}d)"/>
      <circle cx="-2" cy="3" r="1.7" fill="#fff" opacity=".75"/>
    </g>`;

  const flake = (x,y,s)=>`
    <g transform="translate(${x},${y}) scale(${s})" stroke="#eef6ff" stroke-width="1.9" stroke-linecap="round" opacity=".96">
      <line x1="0" y1="-6.5" x2="0" y2="6.5"/><line x1="-5.6" y1="-3.2" x2="5.6" y2="3.2"/><line x1="-5.6" y1="3.2" x2="5.6" y2="-3.2"/>
      <circle cx="0" cy="0" r="1.6" fill="#fff" stroke="none"/>
    </g>`;

  const bolt = (x,y,s)=>`
    <g transform="translate(${x},${y}) scale(${s})">
      <path d="M2,-14 L-8,4 L-1,4 L-4,16 L10,-2 L2.6,-2 L8,-14 Z" fill="url(#${u}b)"
            stroke="rgba(255,255,255,.6)" stroke-width=".8" filter="drop-shadow(0 0 4px rgba(255,200,40,.8))"/>
    </g>`;

  const fogL = y=>`
    <g stroke="#e4edf7" stroke-linecap="round">
      <line x1="22" y1="${y}"   x2="78" y2="${y}"   stroke-width="5" opacity=".9"/>
      <line x1="28" y1="${y+9}" x2="72" y2="${y+9}" stroke-width="5" opacity=".55"/>
      <line x1="34" y1="${y+18}" x2="66" y2="${y+18}" stroke-width="5" opacity=".3"/>
    </g>`;

  const orb = (x,y,r)=> isDay ? sun(x,y,r) : moon(x,y,r);
  const [, cls] = wmoInfo(code);
  let body = "";
  switch(cls){
    case "clear":
      body = (code===1) ? orb(48,46,26) + cloud(66,68,.62) : orb(50,50,28); break;
    case "part":
      body = orb(38,36,20) + cloud(54,58,.95); break;
    case "cloud":
      body = cloud(62,44,.7,true) + cloud(44,58,1); break;
    case "fog":
      body = cloud(50,42,.9) + fogL(70); break;
    case "drizzle":
      body = cloud(50,44,1) + drop(38,76,.72) + drop(58,80,.72); break;
    case "rain":
      body = (code>=80 ? orb(32,30,15) : "") + cloud(52,44,1,code>=63&&code<80) +
             drop(34,76,.9) + drop(52,82,.9) + drop(68,76,.9); break;
    case "snow":
      body = cloud(50,42,1) + flake(34,74,1) + flake(52,82,.85) + flake(68,73,1); break;
    case "storm":
      body = cloud(50,40,1.05,true) + bolt(48,74,1) + (code>95 ? drop(70,74,.75)+drop(28,72,.75) : ""); break;
    default:
      body = cloud(50,50,1);
  }
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="overflow:visible"><defs>${defs}</defs>${body}</svg>`;
}

/* Petites icônes utilitaires (détails, gouttes…) */
function miniDrop(size, op){
  const u = "i"+(_uid++);
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><defs>
    <linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5e6ff"/><stop offset="1" stop-color="#2c8ae6"/></linearGradient></defs>
    <path d="M12,2 C15.4,7 18,10.6 18,14 A6,6 0 1 1 6,14 C6,10.6 8.6,7 12,2 Z" fill="url(#${u})" opacity="${op||1}"/>
    <circle cx="9.6" cy="13.6" r="1.5" fill="#fff" opacity=".7"/></svg>`;
}
function miniIcon(kind, extra){
  const u = "i"+(_uid++);
  const gr = `<linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a8cdf0"/></linearGradient>`;
  switch(kind){
    case "humid": return miniDrop(44);
    case "wind": return `<svg viewBox="0 0 44 44" width="44" height="44"><defs>${gr}</defs>
      <circle cx="22" cy="22" r="20" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
      <g transform="rotate(${(extra||0)+180} 22 22)">
        <path d="M22,7 L28,22 L22,18.5 L16,22 Z" fill="url(#${u})"/>
        <line x1="22" y1="20" x2="22" y2="34" stroke="url(#${u})" stroke-width="3" stroke-linecap="round"/>
      </g></svg>`;
    case "gauge": return `<svg viewBox="0 0 44 44" width="44" height="44"><defs>${gr}</defs>
      <path d="M8,32 A16,16 0 1 1 36,32" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M8,32 A16,16 0 0 1 22,6" fill="none" stroke="url(#${u})" stroke-width="3.6" stroke-linecap="round"/>
      <circle cx="22" cy="24" r="3.4" fill="#fff"/>
      <line x1="22" y1="24" x2="12.5" y2="17" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`;
    case "eye": return `<svg viewBox="0 0 44 44" width="44" height="44"><defs>${gr}</defs>
      <path d="M4,22 C10,13 16,9 22,9 C28,9 34,13 40,22 C34,31 28,35 22,35 C16,35 10,31 4,22 Z"
            fill="none" stroke="url(#${u})" stroke-width="2.8"/>
      <circle cx="22" cy="22" r="7" fill="url(#${u})"/><circle cx="19.6" cy="19.6" r="2.2" fill="#2a6ec0"/></svg>`;
    case "uv": return `<svg viewBox="0 0 44 44" width="44" height="44"><defs>
      <radialGradient id="${u}" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff8dc"/>
      <stop offset=".6" stop-color="#ffd94d"/><stop offset="1" stop-color="#ff9c1b"/></radialGradient></defs>
      <g stroke="#ffd94d" stroke-width="3" stroke-linecap="round" opacity=".9">
        ${[0,45,90,135,180,225,270,315].map(a=>{const r=Math.PI*a/180,c=Math.cos(r),s=Math.sin(r);
          return `<line x1="${22+c*15}" y1="${22+s*15}" x2="${22+c*19}" y2="${22+s*19}"/>`;}).join("")}
      </g><circle cx="22" cy="22" r="10" fill="url(#${u})"/>
      <ellipse cx="19.5" cy="18.5" rx="5.4" ry="3" fill="#fff" opacity=".55"/></svg>`;
    case "umbrella": return `<svg viewBox="0 0 44 44" width="44" height="44"><defs>
      <linearGradient id="${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe0ff"/>
      <stop offset="1" stop-color="#2f7fd6"/></linearGradient></defs>
      <path d="M6,21 C7,11 14,5 22,5 C30,5 37,11 38,21 C32,17 27,17 22,21 C17,17 12,17 6,21 Z" fill="url(#${u})"/>
      <ellipse cx="17" cy="10.5" rx="6.5" ry="3" fill="#fff" opacity=".5" transform="rotate(-16 17 10.5)"/>
      <path d="M22,21 L22,34 A4,4 0 0 1 14,34" fill="none" stroke="#e6f2ff" stroke-width="2.8" stroke-linecap="round"/></svg>`;
    case "sunrise": return `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M12,4 L16,9 L13.4,9 L13.4,14 L10.6,14 L10.6,9 L8,9 Z" fill="#ffd94d"/>
      <line x1="4" y1="18" x2="20" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/></svg>`;
    case "sunset": return `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M12,14 L16,9 L13.4,9 L13.4,4 L10.6,4 L10.6,9 L8,9 Z" fill="#ffab52"/>
      <line x1="4" y1="18" x2="20" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/></svg>`;
    case "moon": return `<svg viewBox="0 0 24 24" width="24" height="24">
      <path d="M15,3 A9.5,9.5 0 1 0 21,14 A7.6,7.6 0 0 1 15,3 Z" fill="#dce8fb"/></svg>`;
    case "clock": return `<svg viewBox="0 0 24 24" width="24" height="24">
      <circle cx="12" cy="12" r="9.4" fill="none" stroke="#dce8fb" stroke-width="2"/>
      <path d="M12,6.5 L12,12 L16,14.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;
  }
  return "";
}

/* ══════════════════════════ DONNÉES ═══════════════════════════ */
const state = {
  model:null, demo:false, view:0, lastFetch:0,
  sunrise:null, sunset:null, sunriseNext:null,
};

function apiURL(){
  const p = new URLSearchParams({
    latitude:CFG.latitude, longitude:CFG.longitude, timezone:"auto", forecast_days:"8",
    current:"temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m",
    hourly:"temperature_2m,weather_code,precipitation_probability,visibility,uv_index,is_day",
    daily:"weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,uv_index_max",
  });
  return "https://api.open-meteo.com/v1/forecast?" + p;
}

function normalize(j){
  const now = new Date();
  const hi = Math.max(0, j.hourly.time.findIndex(t => new Date(t) > now) - 1);
  const hour = k => j.hourly[k] ? j.hourly[k][hi] : null;
  const hourly = [];
  for (let i = hi+1; i < Math.min(hi+1+24, j.hourly.time.length); i++){
    hourly.push({
      time:new Date(j.hourly.time[i]),
      temp:j.hourly.temperature_2m[i],
      code:j.hourly.weather_code[i],
      pprob:j.hourly.precipitation_probability ? j.hourly.precipitation_probability[i] : 0,
      isDay:j.hourly.is_day ? !!j.hourly.is_day[i] : true,
    });
  }
  const daily = j.daily.time.map((t,i)=>({
    date:new Date(t + "T12:00:00"),
    code:j.daily.weather_code[i],
    tmax:j.daily.temperature_2m_max[i],
    tmin:j.daily.temperature_2m_min[i],
    pprob:j.daily.precipitation_probability_max ? (j.daily.precipitation_probability_max[i] ?? 0) : 0,
    sunrise:new Date(j.daily.sunrise[i]),
    sunset:new Date(j.daily.sunset[i]),
    uvmax:j.daily.uv_index_max ? j.daily.uv_index_max[i] : null,
  }));
  return {
    current:{
      temp:j.current.temperature_2m,
      feels:j.current.apparent_temperature,
      code:Q.has("code") ? +Q.get("code") : j.current.weather_code,
      isDay:!!j.current.is_day,
      humidity:j.current.relative_humidity_2m,
      wind:j.current.wind_speed_10m,
      windD:j.current.wind_direction_10m,
      pressure:j.current.surface_pressure,
      precip:j.current.precipitation,
      visibility:hour("visibility"),
      uv:hour("uv_index"),
    },
    hourly, daily,
  };
}

/* Données de démonstration plausibles (si l'API est injoignable) */
function demoModel(){
  const now = new Date();
  const h0 = now.getHours() + now.getMinutes()/60;
  const baseT = h => 19 + 5.5*Math.cos((h-15.5)/24*2*Math.PI) + .6*Math.sin(h*1.7);
  const codes = [0,1,2,2,3,61,80];
  const mk = new Date(now); mk.setHours(6,52,0,0);
  const ms = new Date(now); ms.setHours(21,26,0,0);
  const hourly = [];
  for (let i=1;i<=24;i++){
    const t = new Date(now.getTime()+i*36e5), hh = (h0+i)%24;
    hourly.push({ time:t, temp:baseT(hh), code:hh>7&&hh<22 ? (i%9===5?2:i%9===8?61:0) : 0,
                  pprob:i%9===8?55:i%9===5?20:0, isDay:hh>7&&hh<21.5 });
  }
  const daily = [];
  for (let i=0;i<8;i++){
    const d = new Date(now.getTime()+i*864e5);
    const sr = new Date(d); sr.setHours(6,52+i,0,0);
    const ss = new Date(d); ss.setHours(21,26-i,0,0);
    daily.push({ date:d, code:codes[i%7], tmax:24+3*Math.sin(i*1.3), tmin:14+2*Math.sin(i*.9+1),
                 pprob:[0,5,10,20,60,80,15][i%7], sunrise:sr, sunset:ss, uvmax:6.5 });
  }
  const isDay = now > mk && now < ms;
  return {
    current:{ temp:baseT(h0), feels:baseT(h0)+1.2, code:Q.has("code") ? +Q.get("code") : (isDay?1:0),
      isDay, humidity:52, wind:14, windD:230, pressure:1016, precip:0, visibility:24140, uv:isDay?5.4:0 },
    hourly, daily,
  };
}

async function fetchWeather(){
  if (Q.get("demo")==="1") throw new Error("forcé");
  const r = await fetch(apiURL(), {signal:AbortSignal.timeout(9000)});
  if (!r.ok) throw new Error("HTTP "+r.status);
  return normalize(await r.json());
}

async function refresh(){
  try {
    state.model = await fetchWeather();
    state.demo = false;
  } catch(e){
    if (!state.model || state.demo) { state.model = demoModel(); state.demo = true; }
  }
  const d0 = state.model.daily[0], d1 = state.model.daily[1];
  state.sunrise = d0.sunrise; state.sunset = d0.sunset;
  state.sunriseNext = d1 ? d1.sunrise : new Date(d0.sunrise.getTime()+864e5);
  state.lastFetch = Date.now();
  $("demo-badge").classList.toggle("on", state.demo);
  $("credit").textContent = state.demo
    ? "Données de démonstration"
    : "Données Open-Meteo · " + fmtH.format(new Date());
  renderAll();
  gfx.applyWeather();
}

function renderDetails(){
  const c = state.model.current, d0 = state.model.daily[0];
  const visKm = c.visibility != null ? c.visibility/1000 : null;
  const uv = c.uv != null ? c.uv : 0;
  const tiles = [
    { icon:miniIcon("humid"), name:"Humidité", value:`${Math.round(c.humidity)}<small>%</small>`,
      sub:c.humidity>75?"Air très humide":c.humidity>45?"Confortable":"Air sec", g:c.humidity/100 },
    { icon:miniIcon("wind", c.windD), name:"Vent", value:`${Math.round(c.wind)}<small>km/h</small>`,
      sub:`Direction ${windDir(c.windD)}`, g:clamp(c.wind/70,0,1) },
    { icon:miniIcon("gauge"), name:"Pression", value:`${Math.round(c.pressure)}<small>hPa</small>`,
      sub:c.pressure>1022?"Anticyclone":c.pressure<1008?"Dépression":"Stable", g:clamp((c.pressure-980)/50,0,1) },
    { icon:miniIcon("eye"), name:"Visibilité", value:visKm!=null?`${visKm>=10?Math.round(visKm):visKm.toFixed(1).replace(".",",")}<small>km</small>`:"—",
      sub:visKm==null?"":visKm>=20?"Excellente":visKm>=8?"Bonne":"Réduite", g:visKm!=null?clamp(visKm/25,0,1):0 },
    { icon:miniIcon("uv"), name:"Indice UV", value:`${(Math.round(uv*10)/10).toString().replace(".",",")}`,
      sub:uvLabel(uv), g:clamp(uv/11,0,1) },
    { icon:miniIcon("umbrella"), name:"Précipitations", value:`${Math.round(d0.pprob)}<small>%</small>`,
      sub:c.precip>0?`${(""+c.precip).replace(".",",")} mm cette heure`:"Probabilité aujourd'hui", g:d0.pprob/100 },
  ];
  $("v-details").innerHTML = `
    <div class="eyebrow st" style="--i:0">En détail</div>
    <div id="tiles">${tiles.map((t,i)=>`
      <div class="tile glass st ${i%2?"float2":"float"}" style="--i:${i+1}">
        <div class="t-head">${t.icon}<span>${t.name}</span></div>
        <div class="t-value">${t.value}</div>
        <div class="t-sub">${t.sub}</div>
        <div class="gauge"><i style="width:${Math.round(t.g*100)}%"></i></div>
      </div>`).join("")}
    </div>`;
}

function renderHourly(){
  const hs = state.model.hourly.filter((_,i)=>i%1===0).slice(0,10);
  if (!hs.length) return;
  const W=1560, H=560, padL=60, padR=60, top=110, bottom=390;
  const step = (W-padL-padR)/(hs.length-1);
  const temps = hs.map(h=>h.temp);
  const tmin = Math.min(...temps)-1.5, tmax = Math.max(...temps)+1.5;
  const X = i => padL + i*step;
  const Y = t => bottom - (t-tmin)/(tmax-tmin)*(bottom-top) + 0;
  let path = `M ${X(0)},${Y(temps[0])}`;
  for (let i=0;i<temps.length-1;i++){
    const x0=X(i), y0=Y(temps[i]), x1=X(i+1), y1=Y(temps[i+1]);
    path += ` C ${x0+step/2},${y0} ${x1-step/2},${y1} ${x1},${y1}`;
  }
  const area = path + ` L ${X(temps.length-1)},${bottom+70} L ${X(0)},${bottom+70} Z`;
  const cols = hs.map((h,i)=>{
    const x=X(i), y=Y(h.temp);
    return `
      <text x="${x}" y="${y-26}" text-anchor="middle" font-size="30" font-weight="600" fill="#fff">${Math.round(h.temp)}°</text>
      <circle cx="${x}" cy="${y}" r="7" fill="#fff" filter="url(#hglow)"/>
      <circle cx="${x}" cy="${y}" r="3.2" fill="#7fd0ff"/>
      <svg x="${x-33}" y="${bottom+18}" width="66" height="66" viewBox="0 0 100 100" style="overflow:visible">${
        iconSVG(h.code, h.isDay, 66).replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"")}</svg>
      <text x="${x}" y="${bottom+124}" text-anchor="middle" font-size="24" font-weight="300" fill="rgba(255,255,255,.85)">${
        String(h.time.getHours()).padStart(2,"0")} h</text>
      ${h.pprob>=15?`<g transform="translate(${x-24},${bottom+140})" opacity=".9">
          <svg x="0" y="0" width="18" height="18" viewBox="0 0 24 24"><path d="M12,2 C15.4,7 18,10.6 18,14 A6,6 0 1 1 6,14 C6,10.6 8.6,7 12,2 Z" fill="#8ecdf7"/></svg>
          <text x="24" y="14" font-size="19" fill="#bfe2fb">${h.pprob} %</text></g>`:""}`;
  }).join("");
  $("v-hourly").innerHTML = `
    <div class="eyebrow st" style="--i:0">Heure par heure</div>
    <div class="glass float st" id="hourly-panel" style="--i:1">
      <svg id="hourly-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="harea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="rgba(255,255,255,.30)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <linearGradient id="hline" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#9fe0ff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9fe0ff"/>
          </linearGradient>
          <filter id="hglow" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur stdDeviation="4"/></filter>
        </defs>
        <path d="${area}" fill="url(#harea)"/>
        <path d="${path}" fill="none" stroke="url(#hline)" stroke-width="12" opacity=".28" filter="url(#hglow)"/>
        <path d="${path}" fill="none" stroke="url(#hline)" stroke-width="4.5" stroke-linecap="round"/>
        ${cols}
      </svg>
    </div>`;
}

function renderWeek(){
  const days = state.model.daily.slice(0,7);
  const wmin = Math.min(...days.map(d=>d.tmin)), wmax = Math.max(...days.map(d=>d.tmax));
  const span = Math.max(wmax-wmin, 1);
  const rows = days.map((d,i)=>{
    const l = (d.tmin-wmin)/span*100, w = Math.max((d.tmax-d.tmin)/span*100, 6);
    const name = i===0 ? "Aujourd'hui" : fmtDay.format(d.date);
    return `
      <div class="wrow st ${i===0?"today":""}" style="--i:${i+1}">
        <div class="w-day">${name}</div>
        <div class="w-icon">${iconSVG(d.code, true, 58)}</div>
        <div class="w-rain">${d.pprob>=10 ? miniDrop(17,.9)+`<span>${Math.round(d.pprob)} %</span>` : ""}</div>
        <div class="w-min">${deg(d.tmin)}</div>
        <div class="w-track"><div class="w-seg" style="left:${l}%;width:${w}%;
             background:linear-gradient(90deg, ${rgb(tempColor(d.tmin))}, ${rgb(tempColor(d.tmax))})"></div></div>
        <div class="w-max">${deg(d.tmax)}</div>
      </div>`;
  }).join("");
  $("v-week").innerHTML = `
    <div class="eyebrow st" style="--i:0">La semaine</div>
    <div class="glass float st" id="week-panel" style="--i:1">${rows}</div>`;
}

function renderSun(){
  const now = new Date();
  const sr = state.sunrise, ss = state.sunset, srN = state.sunriseNext;
  const isDay = now >= sr && now <= ss;
  const W=1560, H=430, cx=W/2, cy=372, R=290;
  const f = isDay
    ? clamp((now-sr)/(ss-sr), 0, 1)
    : clamp((now-ss)/(srN-ss) , 0, 1);
  const ang = Math.PI*(1-f);
  const px = cx + R*Math.cos(ang), py = cy - R*Math.sin(ang);
  const arc = `M ${cx-R},${cy} A ${R},${R} 0 0 1 ${cx+R},${cy}`;
  const dur = ss - sr, hh = Math.floor(dur/36e5), mm = Math.round(dur%36e5/6e4);
  const nextEvt = isDay ? ["Coucher dans", ss] : ["Lever dans", now < sr ? sr : srN];
  const dt = nextEvt[1] - now, dh = Math.floor(dt/36e5), dm = Math.max(0, Math.round(dt%36e5/6e4));
  const orbGrad = isDay
    ? `<radialGradient id="sunorb" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#fffce9"/>
       <stop offset=".55" stop-color="#ffd94d"/><stop offset="1" stop-color="#ff9c1b"/></radialGradient>
       <radialGradient id="sunhalo"><stop offset="0" stop-color="rgba(255,215,80,.85)"/><stop offset="1" stop-color="rgba(255,215,80,0)"/></radialGradient>`
    : `<radialGradient id="sunorb" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#ffffff"/>
       <stop offset=".6" stop-color="#dce8fb"/><stop offset="1" stop-color="#a9bfe4"/></radialGradient>
       <radialGradient id="sunhalo"><stop offset="0" stop-color="rgba(190,215,255,.7)"/><stop offset="1" stop-color="rgba(190,215,255,0)"/></radialGradient>`;
  $("v-sun").innerHTML = `
    <div class="eyebrow st" style="--i:0">Soleil &amp; lune</div>
    <div class="glass float st" id="sun-panel" style="--i:1">
      <svg id="sun-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <defs>
          ${orbGrad}
          <linearGradient id="arcgrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ffd94d"/><stop offset="1" stop-color="#ff9466"/>
          </linearGradient>
        </defs>
        <line x1="90" y1="${cy}" x2="${W-90}" y2="${cy}" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <path d="${arc}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="4" stroke-dasharray="3 14" stroke-linecap="round"/>
        <path d="${arc}" pathLength="100" fill="none" stroke="${isDay?"url(#arcgrad)":"rgba(205,222,250,.55)"}"
              stroke-width="6" stroke-linecap="round" stroke-dasharray="${(f*100).toFixed(2)} 100"
              style="filter:drop-shadow(0 0 10px ${isDay?"rgba(255,200,80,.8)":"rgba(180,205,255,.6)"})"/>
        <circle cx="${px}" cy="${py}" r="64" fill="url(#sunhalo)"/>
        <circle cx="${px}" cy="${py}" r="26" fill="url(#sunorb)" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>
        <ellipse cx="${px-6}" cy="${py-10}" rx="15" ry="8" fill="#fff" opacity=".55"/>
        <g font-weight="300" fill="#fff">
          <text x="${cx-R}" y="${cy+46}" text-anchor="middle" font-size="26" opacity=".8">Lever</text>
          <text x="${cx-R}" y="${cy-18}" text-anchor="middle" font-size="40" font-weight="400">${fmtH.format(sr)}</text>
          <text x="${cx+R}" y="${cy+46}" text-anchor="middle" font-size="26" opacity=".8">Coucher</text>
          <text x="${cx+R}" y="${cy-18}" text-anchor="middle" font-size="40" font-weight="400">${fmtH.format(ss)}</text>
        </g>
      </svg>
      <div id="sun-chips">
        <div class="chip st" style="--i:2">${miniIcon("clock")} Durée du jour&nbsp;<b>${hh} h ${String(mm).padStart(2,"0")}</b></div>
        <div class="chip st" style="--i:3">${miniIcon(isDay?"sunset":"sunrise")} ${nextEvt[0]}&nbsp;<b data-live="next">${dh} h ${String(dm).padStart(2,"0")}</b></div>
        <div class="chip st" style="--i:4">${miniIcon("moon")} ${moonPhase(now)}</div>
      </div>
    </div>`;
}

/* ══════════════════ ROTATION DES VUES ═════════════════════════ */
const VIEWS = ["v-now","v-details","v-hourly","v-week","v-sun"];
const RENDER = [renderNow, renderDetails, renderHourly, renderWeek, renderSun];

function initDots(){
  $("dots").innerHTML = VIEWS.map((_,i)=>`<div class="dot" id="dot${i}"></div>`).join("");
}
function showView(n, first){
  const prev = state.view;
  state.view = n;
  if (!first){
    const pv = $(VIEWS[prev]);
    pv.classList.remove("active"); pv.classList.add("leaving");
    setTimeout(()=>pv.classList.remove("leaving"), 950);
  }
  if (state.model) RENDER[n]();          // re-rendu juste avant l'entrée → données fraîches
  $(VIEWS[n]).classList.add("active");
  VIEWS.forEach((_,i)=>$("dot"+i).classList.toggle("on", i===n));
}
function startRotation(){
  if (Q.has("vue")){ showView(clamp(+Q.get("vue"),0,VIEWS.length-1), true); return; }
  showView(0, true);
  let cycle = 0;
  setInterval(()=>{
    const next = (state.view+1) % VIEWS.length;
    if (next===0){ // léger décalage anti-marquage à chaque cycle complet
      cycle++;
      $("stage").style.setProperty("--ox", (Math.sin(cycle*1.7)*5).toFixed(1)+"px");
      $("stage").style.setProperty("--oy", (Math.cos(cycle*2.3)*4).toFixed(1)+"px");
    }
    showView(next);
  }, CFG.dureeVue*1000);
}

/* ══════════════════ HORLOGE & MISE À L'ÉCHELLE ════════════════ */
function tickClock(){
  const now = new Date();
  const h = String(now.getHours()).padStart(2,"0"), m = String(now.getMinutes()).padStart(2,"0");
  $("clock").innerHTML = `${h}<span class="colon">:</span>${m}`;
  const ds = fmtDate.format(now);
  $("date").textContent = ds.charAt(0).toUpperCase()+ds.slice(1);
  // compte à rebours vivant sur la vue soleil
  const live = document.querySelector('#v-sun.active [data-live="next"]');
  if (live && state.sunrise){
    const isDay = now >= state.sunrise && now <= state.sunset;
    const target = isDay ? state.sunset : (now < state.sunrise ? state.sunrise : state.sunriseNext);
    const dt = Math.max(0, target - now);
    live.textContent = `${Math.floor(dt/36e5)} h ${String(Math.round(dt%36e5/6e4)).padStart(2,"0")}`;
  }
}
function fitStage(){
  const portrait = innerHeight > innerWidth;
  document.body.classList.toggle("portrait", portrait);
  const W = portrait ? 1080 : 1920, H = portrait ? 1920 : 1080;
  const s = Math.min(innerWidth/W, innerHeight/H);
  $("stage").style.setProperty("--s", s.toFixed(4));
}

/* ════════════════════ FOND THREE.JS ═══════════════════════════ */
const gfx = (() => {
  const canvas = $("gl");
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.autoClear = false;

  /* — Ciel : quad plein écran shaderisé — */
  const bgScene = new THREE.Scene();
  const bgCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const uniforms = {
    uTime:{value:0}, uAspect:{value:16/9},
    uColTop:{value:new THREE.Color(0x0a56de)},
    uColMid:{value:new THREE.Color(0x2088f2)},
    uColBot:{value:new THREE.Color(0x66dcf6)},
    uCel:{value:new THREE.Vector2(.5,.75)},
    uSunI:{value:0}, uMoonI:{value:0},
    uWarm:{value:0}, uDay:{value:1},
    uCloud:{value:0}, uFog:{value:0}, uFlash:{value:0}, uRays:{value:0},
  };
  const bgMat = new THREE.ShaderMaterial({
    uniforms, depthTest:false, depthWrite:false,
    vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }`,
    fragmentShader:`
      precision highp float;
      varying vec2 vUv;
      uniform float uTime,uAspect,uSunI,uMoonI,uWarm,uDay,uCloud,uFog,uFlash,uRays;
      uniform vec2 uCel; uniform vec3 uColTop,uColMid,uColBot;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
      float noise(vec2 p){
        vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),
                   mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y);
      }
      float fbm(vec2 p){
        float v=0., a=.5;
        for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.03+vec2(13.7,7.1); a*=.5; }
        return v;
      }
      float band(vec2 uv, float y0, float sp, float fr, float t){
        float yy = uv.y - y0 - .11*sin(uv.x*fr + t*sp) - .1*(fbm(vec2(uv.x*2.1 + t*.026, y0*7.))-.5);
        return exp(-yy*yy*150.);
      }
      void main(){
        vec2 uv = vUv;
        float t = uTime;
        // dégradé de fond, ondulé par du bruit lent
        float w = fbm(vec2(uv.x*2.1, uv.y*1.5) + t*.013);
        float g = clamp(uv.y + (w-.5)*.2, 0., 1.);
        vec3 col = mix(uColBot, uColMid, smoothstep(0., .52, g));
        col = mix(col, uColTop, smoothstep(.42, 1., g));
        // rubans lumineux (aurora très douce)
        float night = 1.-uDay;
        col += mix(vec3(.22,.85,.78), vec3(.36,.48,1.0), night) * band(uv,.64,.10,3.1,t) * (.055+.075*night);
        col += mix(vec3(.5,.8,1.),   vec3(.52,.34,.95), night) * band(uv,.34,.075,2.2,t) * (.045+.06*night);
        col += vec3(.85,.95,1.) * band(uv,.5,.06,1.6,t+40.) * .03;
        // halo soleil / lune
        vec2 p = vec2(uv.x*uAspect, uv.y);
        vec2 s = vec2(uCel.x*uAspect, uCel.y);
        float d = distance(p,s);
        vec3 warmCol = mix(vec3(1.,.985,.92), vec3(1.,.66,.32), uWarm);
        col += warmCol * uSunI * (exp(-d*d*20.)*.5 + exp(-d*3.2)*.24);
        // rais de lumière volumétriques (ciel dégagé) : sinusoïdes angulaires
        // contra-rotatives, jamais de rayons durs
        float angl = atan(p.y-s.y, p.x-s.x);
        float rays = .5 + .30*sin(angl*5. - t*.020) + .18*sin(angl*9. + t*.031) + .12*sin(angl*14. - t*.047);
        rays = pow(max(rays, 0.), 2.4);
        col += warmCol * uSunI * uRays * rays * exp(-d*1.1) * smoothstep(.03,.24,d) * .17;
        col += vec3(.72,.83,1.) * uMoonI * (exp(-d*d*55.)*.75 + exp(-d*4.5)*.22);
        // lueur chaude d'horizon (aube/crépuscule)
        col = mix(col, vec3(1.,.55,.26), uWarm * .2 * exp(-abs(uv.y-.13)*5.));
        // couche de nuages
        float cl = fbm(uv*vec2(3.,2.1) + vec2(t*.011, 0.));
        float cl2 = fbm(uv*vec2(5.,3.6) + vec2(t*.019, 3.7));
        float cm = smoothstep(.62-uCloud*.34, .9, cl*.72+cl2*.38) * uCloud;
        vec3 cc = mix(vec3(.13,.17,.27), vec3(.86,.9,.97), clamp(uDay,.12,1.));
        col = mix(col, cc, cm*.55);
        // brouillard
        col = mix(col, vec3(.74,.8,.9)*mix(.3,1.,uDay), uFog*.62*(1.-uv.y*.5));
        // vignettage + éclair d'orage + dither
        col *= 1. - .15*length(uv-vec2(.5,.46));
        col += vec3(1.,.98,.9)*uFlash;
        col += (hash(uv*vec2(1920.,1080.) + fract(t))-.5)*.012;
        gl_FragColor = vec4(col, 1.);
      }`,
  });
  bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMat));

  /* — Scène 3D : nuages, éclats de verre, précipitations — */
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(45, 16/9, .1, 100);
  cam.position.set(0,0,16);
  const sstep = (a,b,x)=>{ x=clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); };

  // Nuages volumétriques : billboards en parallaxe, FBM déformé,
  // auto-ombrage dirigé vers le soleil, base plate, teintes jour/nuit/orage
  const cloudVert = `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`;
  const cloudFrag = `
    precision highp float;
    varying vec2 vUv;
    uniform float uTime,uSeed,uOpacity,uDay,uWarm,uDark,uWisp;
    uniform vec2 uLdir;
    uniform vec3 uSkyCol;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
    float noise(vec2 p){
      vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),
                 mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y);
    }
    float fbm3(vec2 p){
      float v=0.,a=.5;
      for(int i=0;i<3;i++){ v+=a*noise(p); p=p*2.03+vec2(11.3,7.9); a*=.5; }
      return v;
    }
    float fbm5(vec2 p){
      float v=0.,a=.5;
      for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.02+vec2(11.3,7.9); a*=.55; }
      return v;
    }
    // Densité détaillée : silhouette DÉFINIE par le fractal (pas de masque ovale).
    // Warp de domaine → billows en chou-fleur ; érosion du sommet → filaments.
    float dens(vec2 uv){
      vec2 q = uv*vec2(2.5,2.15) + uSeed;
      q.x += uTime*.006;
      vec2 w = vec2(fbm3(q*.9 + 1.7), fbm3(q*.9 + 8.3));          // domaine ondulé
      float n = fbm5(q + w*(1.15 - uWisp*.4));
      n -= smoothstep(.28, 1., uv.y) * (.34 + uWisp*.22);        // sommet effiloché
      n -= smoothstep(.30, 0., uv.y) * .18;                      // base repliée
      // enveloppe LARGE et douce : ne fait que fondre les bords du plan
      vec2 e = abs(uv - .5);
      float env = smoothstep(.5,.14,e.x) * smoothstep(.5,.12,e.y);
      float th = .46 + uWisp*.06;                                // seuil (type de nuage)
      return clamp((n*env - th) / .30, 0., 1.);
    }
    // Densité grossière pour la marche de lumière (moins d'octaves, sans warp)
    float densLite(vec2 uv){
      vec2 q = uv*vec2(2.5,2.15) + uSeed; q.x += uTime*.006;
      float n = fbm3(q);
      n -= smoothstep(.28,1.,uv.y)*(.34+uWisp*.22) + smoothstep(.30,0.,uv.y)*.18;
      vec2 e = abs(uv-.5);
      float env = smoothstep(.5,.14,e.x)*smoothstep(.5,.12,e.y);
      return clamp((n*env - (.46+uWisp*.06)) / .30, 0., 1.);
    }
    void main(){
      float d = dens(vUv);
      if (d < .02) discard;

      // marche de lumière : profondeur optique accumulée vers le soleil (Beer-Powder)
      vec2 st = uLdir * .05;
      vec2 sp = vUv;
      float tau = 0.;
      for(int i=0;i<5;i++){ sp += st; tau += densLite(sp); }
      tau /= 5.;
      float toLight = exp(-tau*3.2);                             // 1 = éclairé, 0 = ombré
      float powder  = 1. - exp(-d*3.5);                          // bords qui rougeoient
      float lightE  = mix(.35, 1., toLight) * mix(.55, 1., powder);

      // ambiance verticale : les sommets captent la lumière du ciel
      lightE *= mix(.72, 1.08, smoothstep(0., .85, vUv.y));

      // ── palette moody ──
      vec3 sunLit = mix(vec3(1.,.99,.97), vec3(1.,.79,.55), uWarm);   // crème → ambre bas soleil
      vec3 shadow = mix(vec3(.30,.35,.5), uSkyCol*.62, .55);          // ombre froide teintée ciel
      shadow = mix(shadow, shadow*vec3(.62,.6,.66), uDark);          // orage : plus lourd
      sunLit = mix(sunLit, mix(sunLit, uSkyCol, .35), uDark*.6);
      vec3 col = mix(shadow, sunLit, lightE);
      col = mix(col, uSkyCol*1.05, (1.-toLight)*.22);                // rebond du ciel dans l'ombre
      // liseré argenté vers le soleil sur le bord du nuage
      float rim = smoothstep(.02,.28,d) * (1.-smoothstep(.28,.62,d)) * toLight;
      col += sunLit * rim * .5 * uDay;
      // nuit : désaturé et assombri vers le ciel
      float lum = dot(col, vec3(.3,.5,.2));
      col = mix(mix(vec3(lum)*.7, col, .45), col, clamp(uDay,.15,1.));

      float a = pow(d, .85) * uOpacity;
      gl_FragColor = vec4(col, a);
    }`;
  const cloudGeo = new THREE.PlaneGeometry(1,1);
  const CLOUD_DEFS = [
    { x:-10.5, y:5.2, z:-5.5, w:15.0, h:6.4, th:.00, op:.95, sp: .16, seed: 3.1, wisp:.15 },
    { x:  7.5, y:5.6, z:-4.2, w:12.5, h:5.6, th:.10, op:.92, sp:-.22, seed: 9.7, wisp:.55 },
    { x: -2.0, y:6.2, z:-6.0, w:16.5, h:6.0, th:.22, op:.88, sp: .12, seed:17.3, wisp:.85 },
    { x: 12.5, y:4.7, z: -.5, w:11.0, h:5.2, th:.34, op:.96, sp: .30, seed:23.9, wisp:.05 },
    { x:-14.0, y:4.5, z:-1.2, w: 9.5, h:4.6, th:.46, op:.93, sp:-.32, seed:31.7, wisp:.35 },
    { x:  2.5, y:5.2, z:-3.4, w:13.0, h:5.6, th:.58, op:.90, sp: .19, seed:41.3, wisp:.7 },
    { x: -6.5, y:5.8, z:-4.8, w:11.0, h:5.0, th:.70, op:.88, sp: .25, seed:53.9, wisp:.25 },
  ];
  const clouds = CLOUD_DEFS.map(def => {
    const mat = new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, vertexShader:cloudVert, fragmentShader:cloudFrag,
      uniforms:{
        uTime:{value:0}, uSeed:{value:def.seed}, uOpacity:{value:0},
        uDay:{value:1}, uWarm:{value:0}, uDark:{value:0}, uWisp:{value:def.wisp},
        uLdir:{value:new THREE.Vector2(0,1)}, uSkyCol:{value:new THREE.Color(0x4f93d8)},
      },
    });
    const m = new THREE.Mesh(cloudGeo, mat);
    m.position.set(def.x, def.y, def.z);
    m.scale.set(def.w, def.h, 1);
    m.userData = def;
    scene.add(m);
    return m;
  });

  // Lave « lava-lamp » : metaballs qui fusionnent, rendues en UNE passe plein
  // écran (alpha = 0 hors des blobs → aucun quad individuel, donc aucune boîte
  // possible). Corps liquide translucide teinté par le ciel, chaud au coucher.
  const BLOBS = [
    { x:.16, y:.30, r:.125, ay:.26, sy:.070, py:0.0, ax:.05, sx:.055, px:1.0 },
    { x:.30, y:.66, r:.10,  ay:.30, sy:.090, py:1.7, ax:.06, sx:.045, px:2.1 },
    { x:.48, y:.40, r:.135, ay:.24, sy:.060, py:3.0, ax:.07, sx:.050, px:0.4 },
    { x:.60, y:.72, r:.11,  ay:.28, sy:.080, py:4.2, ax:.05, sx:.055, px:3.3 },
    { x:.76, y:.34, r:.125, ay:.26, sy:.065, py:5.1, ax:.06, sx:.040, px:1.5 },
    { x:.88, y:.60, r:.09,  ay:.31, sy:.085, py:2.4, ax:.05, sx:.050, px:4.0 },
    { x:.40, y:.55, r:.115, ay:.27, sy:.055, py:0.9, ax:.08, sx:.048, px:2.8 },
  ];
  const metaScene = new THREE.Scene();
  const metaMat = new THREE.ShaderMaterial({
    transparent:true, depthTest:false, depthWrite:false,
    uniforms:{
      uTime:{value:0}, uAspect:{value:16/9}, uOpacity:{value:0},
      uWarm:{value:0}, uDay:{value:1}, uSkyCol:{value:new THREE.Color(0x4f93d8)},
      uBlobs:{value:BLOBS.map(()=>new THREE.Vector3())},
    },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
    fragmentShader:`
      precision highp float;
      varying vec2 vUv;
      uniform float uTime,uAspect,uOpacity,uWarm,uDay;
      uniform vec3 uBlobs[7];
      uniform vec3 uSkyCol;
      void main(){
        vec2 p = vec2(vUv.x*uAspect, vUv.y);
        float field = 0.;
        vec2 grad = vec2(0.);
        for(int i=0;i<7;i++){
          vec2 c = vec2(uBlobs[i].x*uAspect, uBlobs[i].y);
          float r = uBlobs[i].z;
          vec2 d = p - c;
          float dd = dot(d,d) + 1e-4;
          field += r*r/dd;
          grad  += (-2.*r*r/(dd*dd))*d;                 // fusion douce des blobs
        }
        float e = .06;
        float surf = smoothstep(1.-e, 1.+e, field);
        if(surf < .003) discard;                        // hors blob → rien (pas de boîte)
        vec3 n = normalize(vec3(-grad*.06, 1.));         // normale approchée (bombé)
        // corps : aqua lumineux translucide teinté par le ciel + volume
        vec3 aqua = mix(vec3(.5,.86,1.), uSkyCol*1.25+.05, .42);
        vec3 body = aqua*(.82 + .32*n.z) * mix(.9,1.12,vUv.y);
        float interior = smoothstep(1., 2.4, field);     // cœur plus dense/lumineux
        body += aqua*interior*.16;
        body = mix(body, mix(body, vec3(1.,.6,.4), .7), uWarm*.72);   // chaud au coucher
        // reflet spéculaire + ménisque lumineux net sur le bord
        float spec = pow(max(dot(n, normalize(vec3(.32,.66,.7))),0.), 26.);
        float rim  = clamp(1. - abs(field-1.)/(e*2.4), 0., 1.);
        vec3 col = body
                 + vec3(1.,.99,.95)*spec*1.05
                 + mix(vec3(.85,.96,1.), vec3(1.,.82,.6), uWarm)*rim*.5;
        // nuit : plus sombre & désaturé
        float lum = dot(col, vec3(.3,.5,.2));
        col = mix(mix(vec3(lum)*.72, col, .5), col, clamp(uDay,.2,1.));
        gl_FragColor = vec4(col, surf*uOpacity);
      }`,
  });
  const metaU = metaMat.uniforms;
  metaScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), metaMat));

  // Précipitations (pluie / neige)
  const P = 900;
  const pGeo = new THREE.BufferGeometry();
  const pos = new Float32Array(P*3), seed = new Float32Array(P);
  for (let i=0;i<P;i++){
    pos[i*3]=(Math.random()*2-1)*16; pos[i*3+1]=(Math.random()*2-1)*9; pos[i*3+2]=-4+Math.random()*10;
    seed[i]=Math.random();
  }
  pGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  pGeo.setAttribute("aSeed", new THREE.BufferAttribute(seed,1));
  const pUniforms = { uTime:{value:0}, uMode:{value:0}, uOpacity:{value:0}, uWind:{value:0} };
  const pMat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, uniforms:pUniforms,
    vertexShader:`
      attribute float aSeed;
      varying float vSeed;
      uniform float uTime, uMode, uWind;
      void main(){
        vSeed = aSeed;
        vec3 p = position;
        float speed = mix(1.1 + aSeed*.7, 13. + aSeed*7., uMode); // uMode: 1=pluie 0=neige
        p.y = 9. - mod(9. - p.y + uTime*speed, 18.);
        p.x += uWind*(9.-p.y)*.12 + (1.-uMode)*sin(uTime*(.6+aSeed) + aSeed*40.)*.8;
        vec4 mv = modelViewMatrix * vec4(p,1.);
        gl_PointSize = mix(9., 26., aSeed) * mix(1.6,1.,uMode) * (140. / -mv.z) * .1;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      varying float vSeed;
      uniform float uMode, uOpacity;
      void main(){
        vec2 pc = gl_PointCoord - .5;
        float rain = (1.-smoothstep(.02,.07,abs(pc.x))) * (1.-smoothstep(.28,.5,abs(pc.y)));
        float snow = 1.-smoothstep(.12,.42,length(pc));
        float a = mix(snow*.85, rain*.6, uMode) * uOpacity * (.5+.5*vSeed);
        if (a < .01) discard;
        vec3 col = mix(vec3(.98,.99,1.), vec3(.72,.85,1.), uMode);
        gl_FragColor = vec4(col, a);
      }`,
  });
  scene.add(new THREE.Points(pGeo, pMat));

  /* — Cibles visuelles (adoucies image par image) — */
  const target = {
    top:new THREE.Color(0x0a56de), mid:new THREE.Color(0x2088f2), bot:new THREE.Color(0x66dcf6),
    cloud:0, fog:0, precip:0, mode:1, wind:0, storm:false,
    dark:0, rays:1, lava:.78,
  };

  const PALETTES = {
    // 3 phases par météo : jour (Aero vif), nuit (bleu profond) et dusk
    // (aube/crépuscule). Le dusk est un dégradé vertical indigo → magenta →
    // or, qui « ouvre » le fond au moment doré ; les états couverts en gardent
    // une version poussiéreuse, l'orage une braise sous la masse sombre.
    clear:   { day:[0x0a56de,0x2088f2,0x66dcf6], night:[0x06133f,0x134394,0x2f79d6], dusk:[0x2a2b74,0xe0587e,0xffab34] },
    part:    { day:[0x1560d4,0x3a92ee,0x84d4f6], night:[0x07153e,0x14428f,0x3379cd], dusk:[0x353576,0xe66d84,0xffb44c] },
    cloud:   { day:[0x35649f,0x6c9ad4,0xa8d2f2], night:[0x0d1b3a,0x263f6c,0x436592], dusk:[0x3c4068,0xb37a90,0xeca46c] },
    fog:     { day:[0x5c81b2,0x8db0d6,0xc4dcf0], night:[0x141d33,0x2c3d5a,0x496486], dusk:[0x565a78,0xbc98a2,0xeec496] },
    drizzle: { day:[0x2059ac,0x4c8ed4,0x8bcbf2], night:[0x0a1a3d,0x163862,0x316096], dusk:[0x333c64,0xac7086,0xe89a62] },
    rain:    { day:[0x1e5092,0x3f83bf,0x79b6e0], night:[0x08132c,0x12335e,0x2a5a94], dusk:[0x2a3658,0x8c6080,0xd68a52] },
    snow:    { day:[0x6090cb,0x97c1ea,0xd0f2fc], night:[0x121f40,0x2e4576,0x4d78ac], dusk:[0x4a5480,0xd08ea6,0xf8c49e] },
    storm:   { day:[0x243c60,0x446292,0x7191ba], night:[0x05091f,0x121d40,0x263f68], dusk:[0x1c2240,0x6a4460,0xbe5e3c] },
  };

  function applyWeather(){
    if (!state.model) return;
    const c = state.model.current;
    const [, cls] = wmoInfo(c.code);
    target.cls = cls;
    target.cloud = { clear:.06, part:.42, cloud:.92, fog:.75, drizzle:.8, rain:.88, snow:.8, storm:.97 }[cls] ?? .4;
    target.fog = cls==="fog" ? .85 : 0;
    const rainy = cls==="rain"||cls==="drizzle"||cls==="storm";
    target.precip = rainy ? (cls==="drizzle"?.45:.95) : cls==="snow" ? .9 : 0;
    target.mode = cls==="snow" ? 0 : 1;
    target.wind = clamp((c.wind||0)/50, 0, 1) * (c.windD>180?-1:1);
    target.storm = cls==="storm";
    target.dark = cls==="storm" ? 1 : cls==="rain" ? .3 : 0;
    target.rays = cls==="clear" ? 1 : cls==="part" ? .45 : 0;
    target.lava = (cls==="clear"||cls==="part") ? .8 : cls==="storm" ? .44 : .6;
  }

  /* Position du soleil/lune + facteur jour, recalculés en continu */
  function celestial(now){
    const sr = state.sunrise ? +state.sunrise : +new Date().setHours(7,0,0,0);
    const ss = state.sunset  ? +state.sunset  : +new Date().setHours(21,0,0,0);
    const srN = state.sunriseNext ? +state.sunriseNext : sr + 864e5;
    const tw = 40*60000;
    const day = clamp((now-(sr-tw))/(2*tw),0,1) * (1-clamp((now-(ss-tw))/(2*tw),0,1));
    const warm = Math.exp(-Math.pow((now-sr)/(70*6e4),2)) + Math.exp(-Math.pow((now-ss)/(70*6e4),2));
    let f, isDay = now>=sr && now<=ss;
    if (isDay) f = (now-sr)/(ss-sr);
    else if (now>ss) f = (now-ss)/(srN-ss);
    else f = 1 - (sr-now)/(864e5-(ss-sr)); // avant l'aube
    f = clamp(f,0,1);
    const x = lerp(.12,.88,f);
    const y = .16 + Math.sin(Math.PI*f) * (isDay ? .62 : .5);
    return { x, y, day, warm:clamp(warm,0,1), isDay };
  }

  let hueT = 0, flashTimer = 3;
  const cur = { day:1, dark:0, cloudAmt:0 };
  const easeCol = (u,t,k)=>{ u.value.r=lerp(u.value.r,t.r,k); u.value.g=lerp(u.value.g,t.g,k); u.value.b=lerp(u.value.b,t.b,k); };

  const clock = new THREE.Clock();
  function frame(){
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), .05);
    const t = clock.elapsedTime;
    uniforms.uTime.value = t;

    const now = Q.has("h")
      ? new Date(new Date().setHours(+Q.get("h"), +(Q.get("min")||0), 0, 0))
      : new Date();
    const cel = celestial(+now);
    cur.day = lerp(cur.day, cel.day, dt*1.2);

    // palette cible selon météo + jour/nuit
    const cls = target.cls || "clear";
    const pal = PALETTES[cls] || PALETTES.clear;
    const gold = Math.min(uniforms.uWarm.value * 1.12, .97);   // poids de la phase dorée (aube/crépuscule)
    const baseCol = (i)=>{
      const c = new THREE.Color(pal.night[i]).lerp(new THREE.Color(pal.day[i]), cur.day);
      if (pal.dusk) c.lerp(new THREE.Color(pal.dusk[i]), gold);
      return c;
    };
    const k = 1 - Math.pow(.25, dt);   // lissage doux
    // En pleine journée le dégradé est resserré (fond uni) ; au crépuscule il
    // s'OUVRE pour révéler tout le dégradé indigo → magenta → or.
    const topPull = lerp(.5,  .1,  gold);
    const botPull = lerp(.34, .04, gold);
    const cMid = baseCol(1);
    easeCol(uniforms.uColTop, baseCol(0).lerp(cMid, topPull), k);
    easeCol(uniforms.uColMid, cMid, k);
    easeCol(uniforms.uColBot, baseCol(2).lerp(cMid, botPull), k);

    uniforms.uCel.value.set(cel.x, cel.y);
    const clearness = 1 - (target.cloud*.75);
    uniforms.uSunI.value  = lerp(uniforms.uSunI.value,  cel.isDay ? clearness*(.55+.45*cel.day) : 0, k);
    uniforms.uMoonI.value = lerp(uniforms.uMoonI.value, !cel.isDay ? clearness*.8 : 0, k);
    uniforms.uWarm.value  = lerp(uniforms.uWarm.value, cel.warm, k);
    uniforms.uDay.value   = cur.day;
    uniforms.uCloud.value = lerp(uniforms.uCloud.value, target.cloud, k*.6);
    uniforms.uFog.value   = lerp(uniforms.uFog.value, target.fog, k*.6);
    uniforms.uRays.value  = lerp(uniforms.uRays.value, target.rays, k*.5);

    // nuages volumétriques : dérive, éclairage vers le soleil, apparition par seuils
    cur.dark = lerp(cur.dark, target.dark, k*.6);
    cur.cloudAmt = lerp(cur.cloudAmt, target.cloud, k*.5);
    const sunWX = (cel.x-.5)*23.6, sunWY = (cel.y-.45)*13.2;
    for (const c of clouds){
      const u = c.userData, mu = c.material.uniforms;
      c.position.x += u.sp*dt;
      const L = 17 + u.w/2;
      if (c.position.x >  L) c.position.x = -L;
      if (c.position.x < -L) c.position.x =  L;
      mu.uTime.value = t;
      mu.uDay.value = cur.day;
      mu.uWarm.value = uniforms.uWarm.value;
      mu.uDark.value = Math.max(cur.dark, sstep(.75,.95,cur.cloudAmt)*.28);
      mu.uSkyCol.value.copy(uniforms.uColMid.value);
      mu.uOpacity.value = sstep(u.th, u.th+.28, cur.cloudAmt) * u.op;
      const lx = sunWX - c.position.x, ly = sunWY - c.position.y;
      const ll = Math.hypot(lx, ly) || 1;
      mu.uLdir.value.set(lx/ll, ly/ll);
    }

    // lave : metaballs qui bobent façon lava-lamp et fusionnent
    metaU.uTime.value = t;
    metaU.uOpacity.value = lerp(metaU.uOpacity.value, target.lava, k);
    metaU.uWarm.value = uniforms.uWarm.value;
    metaU.uDay.value = cur.day;
    metaU.uSkyCol.value.copy(uniforms.uColMid.value);
    // en portrait l'écran étroit fait fusionner les blobs → on les réduit
    const portrait = innerHeight > innerWidth;
    const rS = portrait ? .68 : 1, aS = portrait ? .65 : 1;
    for (let i=0;i<BLOBS.length;i++){
      const b = BLOBS[i];
      metaU.uBlobs.value[i].set(
        b.x + Math.sin(t*b.sx + b.px)*b.ax,
        b.y + Math.sin(t*b.sy + b.py)*b.ay*aS,
        b.r*rS);
    }

    // éclairs d'orage
    if (target.storm){
      flashTimer -= dt;
      if (flashTimer <= 0){ uniforms.uFlash.value = .55+Math.random()*.4; flashTimer = 4+Math.random()*9; }
    }
    uniforms.uFlash.value *= Math.pow(.0015, dt);
    if (uniforms.uFlash.value < .003) uniforms.uFlash.value = 0;

    // précipitations
    pUniforms.uTime.value = t;
    pUniforms.uMode.value = lerp(pUniforms.uMode.value, target.mode, k);
    pUniforms.uOpacity.value = lerp(pUniforms.uOpacity.value, target.precip, k*.5);
    pUniforms.uWind.value = lerp(pUniforms.uWind.value, target.wind, k*.3);

    // très légère dérive de caméra
    cam.position.x = Math.sin(t*.05)*1.05;
    cam.position.y = Math.cos(t*.037)*.6;
    cam.lookAt(0,0,0);

    renderer.clear();
    renderer.render(bgScene, bgCam);
    renderer.render(scene, cam);
    renderer.render(metaScene, bgCam);          // lave par-dessus, sous l'UI DOM
  }

  function resize(){
    renderer.setSize(innerWidth, innerHeight);
    cam.aspect = innerWidth/innerHeight;
    cam.updateProjectionMatrix();
    uniforms.uAspect.value = innerWidth/innerHeight;
    metaU.uAspect.value = innerWidth/innerHeight;
  }

  return { start(){ resize(); frame(); }, resize, applyWeather };
})();

/* ═══════════════════════ DÉMARRAGE ════════════════════════════ */
addEventListener("resize", ()=>{ fitStage(); gfx.resize(); });
fitStage();
$("cityline").textContent = CFG.ville;
initDots();
tickClock();
setInterval(tickClock, 1000);
gfx.start();

refresh().then(()=>{ startRotation(); });
setInterval(refresh, CFG.rafraichissement*60*1000);
</script>
</body>
</html>
